name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version $JAVA_MAJOR is lower than 17."
            exit 1
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create debug.keystore."
            exit 1
          fi
          echo "debug.keystore successfully verified."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK file not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::APK file $EXPECTED_APK does not have .apk extension."
            exit 1
          fi

          echo "APK successfully verified at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | sed 's:.*/::' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]//-/g')
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$RELEASE_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is invalid or missing."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "Automatically generated debug APK built by GitHub Actions (Run #${{ github.run_number }}, Attempt #${{ github.run_attempt }}, Commit ${{ github.sha }}). Intended for testing only and signed with a temporary debug keystore." \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTCOME="${{ steps.create_release.outcome }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "$OUTCOME" = "success" ]; then
            RELEASE_INFO=$(gh release view "$TAG_NAME" --json url,title,tagName -q '.')
            RELEASE_URL=$(echo "$RELEASE_INFO" | grep -o '"url":"[^"]*' | cut -d'"' -f4)
            TITLE=$(echo "$RELEASE_INFO" | grep -o '"title":"[^"]*' | cut -d'"' -f4)

            echo "=== Release Publishing Succeeded ==="
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Debug APK Build & Release Succeeded!

          - **Release Title:** $TITLE
          - **Release Tag:** \`$TAG_NAME\`
          - **Direct Download Link:** [GitHub Release Page]($RELEASE_URL)
          - **APK Asset Filename:** \`$ASSET_NAME\`

          The APK can be downloaded directly from the release **Assets** section on your phone.
          *Backup Artifact:* The GitHub Actions artifact \`app-debug-apk\` is also available.
          EOF
          else
            echo "=== Release Publishing Failed or Skipped ==="
            echo "::warning::GitHub Release creation failed, but the APK build was successful."
            echo "Actions Artifact Name: app-debug-apk"

            cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## ⚠️ Debug APK Build Succeeded (Release Publishing Failed)

          - **APK Build Status:** Succeeded
          - **GitHub Release Status:** Failed / Skipped
          - **Backup Artifact:** \`app-debug-apk\`

          The debug APK was built successfully and is preserved as a normal GitHub Actions artifact named \`app-debug-apk\`.
          EOF
          fi
